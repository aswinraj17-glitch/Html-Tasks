<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    .blue-box{
      height: 300px;
      width: 500px;
      background-color: blue;
      margin: 200px 200px;
    

    }
    .red-circle{
      height: 20%;
      width: 10%;
      border-radius: 50%;
      background-color: red;
      position:absolute;
      margin-left: 250px;
      margin-top: 150px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>
